<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社労士 進捗帳</title>
<meta name="theme-color" content="#1f4e5f">
<style>
:root{
  --bg:#f5f3ee;--panel:#ffffff;--ink:#22262a;--sub:#6b7176;--line:#e2ded5;
  --accent:#1f6f78;--accent-ink:#ffffff;--accent-soft:#e3f0ef;
  --ok:#2f7d4f;--ok-soft:#e2f2e7;--ng:#c0392b;--ng-soft:#fbe5e2;--mid:#b7791f;--mid-soft:#fbf0dc;
  --none:#ebe8e1;--part:#cfe5e2;--done:#2f8a7f;--late:#c0392b;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16191b;--panel:#1f2326;--ink:#e7e9ea;--sub:#9aa1a6;--line:#30363a;
  --accent:#4fb3b9;--accent-ink:#0f1416;--accent-soft:#1d3335;
  --ok:#5cc28a;--ok-soft:#1c3226;--ng:#ef7b6d;--ng-soft:#3a2220;--mid:#e3b25a;--mid-soft:#382d18;
  --none:#2a2f32;--part:#24494a;--done:#3ea89b;--late:#ef7b6d;}}
:root[data-theme="dark"]{
  --bg:#16191b;--panel:#1f2326;--ink:#e7e9ea;--sub:#9aa1a6;--line:#30363a;
  --accent:#4fb3b9;--accent-ink:#0f1416;--accent-soft:#1d3335;
  --ok:#5cc28a;--ok-soft:#1c3226;--ng:#ef7b6d;--ng-soft:#3a2220;--mid:#e3b25a;--mid-soft:#382d18;
  --none:#2a2f32;--part:#24494a;--done:#3ea89b;--late:#ef7b6d;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.sync{font-size:12px;color:var(--sub)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;color:var(--sub);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:13px}
.big{font-size:22px;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stat{flex:1 1 120px;background:var(--bg);border-radius:8px;padding:10px 12px}
.stat .lbl{font-size:12px;color:var(--sub)}
.stat .val{font-size:20px;font-weight:700}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--none);color:var(--sub);margin-right:4px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.sec{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sec:first-of-type{border-top:0}
.sec .main{flex:1 1 260px}
.sec .ttl{font-weight:700}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input[type=date],input[type=number],input[type=password],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:56px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.check input{width:18px;height:18px}
.probs{margin-top:8px}
.prow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;outline:none}
.prow:focus{background:var(--accent-soft)}
.prow .no{width:52px;font-weight:700;font-size:14px}
.prow.untouched .no{color:var(--sub)}
.lim{width:38px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--sub);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lim small{font-size:10px;font-weight:400;color:var(--sub)}
.lim.o{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.lim.x{background:var(--ng-soft);color:var(--ng);border-color:transparent}
.lim.t{background:var(--mid-soft);color:var(--mid);border-color:transparent}
.res{margin-left:6px;min-width:28px;text-align:center;font-weight:700}
.res.o{color:var(--ok)}.res.x{color:var(--ng)}.res.t{color:var(--mid)}
.map{display:grid;grid-template-columns:52px repeat(10,1fr);gap:4px;align-items:center}
.map .sub{font-size:13px;font-weight:700}
.cell{height:30px;border-radius:6px;background:var(--none);border:2px solid transparent;cursor:pointer;font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.cell.part{background:var(--part);color:var(--ink)}
.cell.done{background:var(--done);color:#fff}
.cell.late{border-color:var(--late)}
.cell.blank{visibility:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;background:var(--c);border:2px solid var(--b,transparent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
.bar i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.bar b{font-weight:600;color:var(--ink);font-size:11px}
.loglist div{border-top:1px solid var(--line);padding:6px 0;display:flex;gap:8px;align-items:center;font-size:13px}
.loglist div:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.lock{max-width:420px;margin:60px auto}
.hidden{display:none!important}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:flex;justify-content:flex-end}
.drawer .in{background:var(--panel);width:min(380px,100%);height:100%;padding:18px;overflow:auto}
.kbd{font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tl{position:relative;margin:8px 0 4px}
.tl .months{display:flex;font-size:11px;color:var(--sub)}
.tl .months span{flex:1;border-left:1px solid var(--line);padding-left:3px}
.tl .track{position:relative;height:38px;background:var(--bg);border-radius:8px;margin-top:4px;overflow:hidden}
.tl .ph{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);background:var(--none);border-right:2px solid var(--panel);overflow:hidden;white-space:nowrap}
.tl .ph.past{background:var(--part);color:var(--ink)}
.tl .ph.now{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tl .now-line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ng)}
.tl .now-tag{position:absolute;top:66px;transform:translateX(-50%);font-size:11px;color:var(--ng);font-weight:700;white-space:nowrap}
.tl .msdot{position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--mid);transform:translateX(-50%)}
ul.todo{margin:6px 0 0;padding-left:20px}
ul.todo li{margin:2px 0}
.phase-row{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.phase-row:first-child{border-top:0}
.phase-row .when{width:110px;flex-shrink:0;color:var(--sub);font-size:13px}
.mon{border-top:1px solid var(--line);padding:9px 0 9px 10px;font-size:14px;display:flex;gap:10px}
.mon:first-of-type{border-top:0}
.mon .ml{width:58px;flex-shrink:0;font-weight:700}
.mon .ml small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.mon.past{opacity:.55}
.mon.now{background:var(--bg);border-left:4px solid var(--accent);padding-left:6px;border-radius:6px}
.mon .lab{width:4.6em;flex-shrink:0;color:var(--sub);font-size:12px;padding-top:2px}
.mon .ln{margin:3px 0;display:flex;gap:4px}.mon .ln>div{flex:1;min-width:0;overflow-wrap:anywhere}.mon>div{min-width:0}
.mon .sj{display:inline-block;margin:1px 6px 1px 0;white-space:nowrap}
.mon .sj.cur{font-weight:700;color:var(--accent)}
.tmtime{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:130px}
.tmaway{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tmchip{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.tmchip:empty{display:none}
.sj-head,.sj summary{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1.3fr;gap:8px;align-items:center}
.sj-head{font-size:12px;color:var(--sub);padding:0 8px 4px 22px}
.sj{border-top:1px solid var(--line)}
.sj summary{cursor:pointer;padding:9px 8px;font-size:14px;list-style-position:outside}
.sj summary::-webkit-details-marker{color:var(--sub)}
.sj summary small,.sj-sec small{display:block;font-size:11px;color:var(--sub)}
.sj.now>summary{background:var(--bg);border-radius:8px}
.sj .nm{font-weight:700}
.sj-body{padding:2px 0 10px 14px}
.sj-sec{display:grid;grid-template-columns:44px 2.4fr 1fr 1fr .8fr 1.1fr;gap:8px;align-items:center;padding:6px 8px;border-top:1px dashed var(--line);font-size:13px;cursor:pointer}
.sj-sec:hover{background:var(--bg)}
.sj-sec.now{background:var(--bg);border-radius:6px}
.sj-sec .k{color:var(--sub);font-weight:700}
.sj-sec .y{color:var(--ok);font-weight:700}.sj-sec .m{color:var(--mid);font-weight:700}.sj-sec .n{color:var(--sub)}
.ox i{font-style:normal;margin-right:6px;font-variant-numeric:tabular-nums}
.ox .o{color:var(--ok)}.ox .t{color:var(--mid)}.ox .x{color:var(--ng)}
@media (max-width:700px){.sj-head{display:none}.sj summary{grid-template-columns:repeat(4,1fr);font-size:13px;gap:4px 6px}.sj .nm{grid-column:1/-1}.sj summary .muted{display:none}.sj-body{padding-left:0}.sj-sec{grid-template-columns:repeat(4,1fr);font-size:12px;gap:2px 6px}.sj-sec .tt{grid-column:2/-1}.ox i{margin-right:3px}}
.wt-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.wt-row:first-of-type{border-top:0}
.wt-row .wd{width:120px;flex-shrink:0}.wt-row .wm{flex:1;font-weight:700}
.wt-row .wi{display:flex;gap:6px}.wt-row .wi input{width:80px}
.wt-row.miss .wd{color:var(--mid);font-weight:700}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.daynav .dn-label{flex:1;text-align:center;font-size:15px}
.rv-row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.rv-row:first-of-type{border-top:0}
.rv-main{flex:1;min-width:0}.rv-main small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.rv-chk{font-size:13px;margin-top:2px}.rv-chk b{color:var(--ng)}
.rv-row.done .rv-main>b{color:var(--ok)}.rv-done{display:block;font-size:12px;margin-top:2px;color:var(--ok)}
.rv-btn .lim.dim{opacity:.35;background:var(--panel);color:var(--sub);border-color:var(--line)}.rv-btn .lim.sel{outline:2px solid currentColor;outline-offset:1px}
.rv-btn.lims{flex-direction:column;gap:4px}.rv-l{display:flex;gap:4px;align-items:center}.rv-l .ll{width:16px;font-weight:700;color:var(--sub);font-size:13px}.rv-l .lim{width:36px;height:30px}
.rv-btn{display:flex;gap:6px}.rv-btn .lim{width:44px}
.sec.s-done{background:var(--ok-soft);border-radius:10px;padding:10px;border-top-color:transparent}
.sbadge{flex:0 0 56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--none);color:var(--sub);border:2px dashed var(--line)}
.sbadge.part{background:var(--mid-soft,#fdf1dc);color:var(--mid);border:2px solid var(--mid)}
.sbadge.done{background:var(--ok);color:#fff;border:0;font-size:22px;line-height:1}
.sbadge.done small{font-size:11px;margin-top:2px}
.steps{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stp{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;min-width:130px;color:var(--sub);background:var(--panel)}
.stp .ic{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.stp b{display:block;font-size:13px}.stp small{display:block;font-size:12px}
button.stp{font:inherit;text-align:left;cursor:pointer}button.stp:hover{border-color:var(--accent)}
.stp.ok{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok)}
.stp.ok .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.part{border:1.5px solid var(--mid);color:var(--mid);background:var(--panel)}
.stp.part .ic{border-color:var(--mid)}
.prow{flex-wrap:wrap}
.allo{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:7px;font:inherit;font-size:12px;font-weight:700;padding:0 8px;height:30px;cursor:pointer}
.allo.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.lg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.lg b{font-size:11px;color:var(--sub);padding:0 4px 0 6px}
.lb{width:28px;height:30px;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--line);font:inherit;font-weight:700;cursor:pointer}
.lb:hover{background:var(--bg)}
.lb.on.o{background:var(--ok);color:#fff}.lb.on.t{background:var(--mid);color:#fff}.lb.on.x{background:var(--ng);color:#fff}
.lb.o:not(.on){color:color-mix(in srgb,var(--ok) 45%,transparent)}.lb.t:not(.on){color:color-mix(in srgb,var(--mid) 45%,transparent)}.lb.x:not(.on){color:color-mix(in srgb,var(--ng) 45%,transparent)}
.ms-row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.ms-row:first-child{border-top:0}
.ms-row .left{width:74px;flex-shrink:0;font-weight:700;color:var(--accent)}
@media (max-width:560px){.mon{flex-direction:column;gap:2px}.mon .ml{width:auto}.mon .ml small{display:inline;margin-left:4px}nav{margin-left:0;width:100%}nav button{flex:1}.map{grid-template-columns:40px repeat(10,1fr)}.cell{height:26px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1>社労士 進捗帳</h1><span class="sync" id="sync"></span><span class="sync" id="fsBar"></span><button class="tmchip" id="tmChip" title="タイマー（今日の画面へ）"></button>
  <nav id="nav"><button data-v="all">全体</button><button data-v="today" class="on">今日</button><button data-v="rec">記録</button><button data-v="prog">進み具合</button></nav>
  <button class="iconbtn" id="openSet" title="設定">⚙</button>
</div></header>

<div id="lock" class="lock hidden"><div class="card">
  <h2>合言葉を入力</h2>
  <p class="muted">記録はこの合言葉で暗号化して保存します。合言葉はこの端末に保存されます。忘れると記録は読めなくなるので、別の場所にも控えてください。</p>
  <input type="password" id="passIn" autocomplete="current-password">
  <div style="margin-top:10px"><button class="btn" id="passOk">開く</button></div>
  <p class="muted" id="passMsg"></p>
</div></div>

<main id="app" class="hidden">
<section id="v-all" class="hidden"></section>
<section id="v-today"></section>
<section id="v-rec" class="hidden"></section>
<section id="v-prog" class="hidden"></section>
</main>

<div id="set" class="drawer hidden"><div class="in">
  <h2 style="margin-top:0">設定</h2>
  <div class="card" id="fsCard"><h2>dataフォルダへの自動保存</h2>
    <p class="muted">学習フォルダの「社労士試験合格\data」を選ぶと、記録を保存するたびに 演習記録.csv・学習時間.csv・講義視聴.csv・復習リスト.csv が自動で上書きされます（PCのChrome／Edge）。</p>
    <p class="muted" id="fsDirName">保存先：未設定</p>
    <div class="row"><button class="btn small" id="pickDir">保存先フォルダを選ぶ</button><button class="btn ghost small" id="saveNow">今すぐ保存</button></div></div>
  <div class="card"><h2>手動でダウンロード</h2>
    <div class="row"><button class="btn ghost small" id="expProb">演習記録CSV</button><button class="btn ghost small" id="expTime">学習時間CSV</button><button class="btn ghost small" id="expLec">講義視聴CSV</button></div></div>
  <div class="card"><h2>データ</h2>
    <div class="row"><button class="btn ghost small" id="reload">再読み込み</button><button class="btn ghost small" id="forget">この端末の合言葉を消す</button></div>
    <p class="muted" id="modeNote"></p></div>
  <div class="card"><h2>キーボード操作（問題の記録）</h2>
    <p class="muted">問題の行を選んで <span class="kbd">1</span>〜<span class="kbd">5</span>：肢A〜Eを ○→×→△ と切替／<span class="kbd">0</span>：解いた（全肢○）／<span class="kbd">↑</span><span class="kbd">↓</span>：行移動</p></div>
  <button class="btn ghost" id="closeSet">閉じる</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ===== 設定：接続情報は config.js に書く（index.html には書かない） ===== */
const SUPABASE_URL = (window.SST_CONFIG||{}).SUPABASE_URL || "";
const SUPABASE_ANON_KEY = (window.SST_CONFIG||{}).SUPABASE_ANON_KEY || "";
const TABLE = "sharoushi_logs";

/* ===== 暗号化 ===== */
let KEY=null;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass){
  const e=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",e.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:e.encode(SALT),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function enc(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},KEY,new TextEncoder().encode(JSON.stringify(obj)));
  return "v1."+b64(iv)+"."+b64(ct);
}
async function dec(s){
  const [v,iv,ct]=s.split(".");
  if(v!=="v1") throw 0;
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(iv)},KEY,unb64(ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ===== 状態の計算 ===== */
let S=null;
function derive(){
  const voided=new Set(EVENTS.filter(e=>e.t==="void").map(e=>e.target));
  const logs=EVENTS.filter(e=>e.t==="day" && !voided.has(e.id));
  const minByDate={}; const sec={}; // key `${round}:${id}`
  for(const e of logs){
    minByDate[e.date]=(minByDate[e.date]||0)+(+e.minutes||0);
    for(const it of e.items||[]){
      const k=(it.round||1)+":"+it.sec;
      const s=sec[k]||(sec[k]={read:null,lecture:null,marks:{}});
      if(it.read) s.read=e.date; else if(it.read===false) s.read=null;
      if(it.lecture) s.lecture=e.date; else if(it.lecture===false) s.lecture=null;
      for(const [n,m] of Object.entries(it.probs||{})) s.marks[n]={...m,date:e.date};
    }
  }
  const times=EVENTS.filter(e=>e.t==="time" && !voided.has(e.id));
  for(const e of times) minByDate[e.date]=(minByDate[e.date]||0)+(+e.minutes||0);
  const lecW={}, lecEv={};
  for(const e of EVENTS){ if(voided.has(e.id)) continue;
    if(e.t==="day") for(const it of e.items||[]){ if((it.round||1)!==1) continue; const k="s"+it.sec;
      if(it.lecture && !lecW[k]) lecW[k]=e.date; else if(it.lecture===false){ delete lecW[k]; delete lecEv[k]; } }
    if(e.t==="lec"){ lecW[e.key]=e.date; lecEv[e.key]=e.id; } }
  S={logs,minByDate,sec,lecW,lecEv,times};
}
const secState=(id,round=1)=>{ const st=S.sec[round+":"+id]||{read:null,lecture:null,marks:{}}; if(round===1 && !st.lecture && S.lecW["s"+id]) return {...st,lecture:S.lecW["s"+id]}; return st; };
const LECX=[{key:"x:g1",name:"第1回 ガイダンス",lec:"2026-10中旬"},{key:"x:end",name:"第10回 直前期に向けて",lec:"2027-02中旬"},{key:"x:oudan",name:"横断対策Web講義（約150分）",lec:"2027-03中旬"},{key:"x:hk1",name:"法改正・統計白書対策Web講義①（約150分）",lec:"2027-06下旬"},{key:"x:hk2",name:"法改正・統計白書対策Web講義②（約150分）",lec:"2027-07上旬"}];
const lectureList=()=>[LECX[0],...PLAN.map(p=>({key:"s"+p.id,name:p.s+" Sec"+p.k+" "+p.t,lec:p.lec,sec:p.id})),...LECX.slice(1)];
function lecSummary(){ const t=todayIso(), L=lectureList().map(l=>({...l,rel:lecDate(l),watched:S.lecW[l.key]||null}));
  const released=L.filter(l=>l.rel&&l.rel<=t); return {L,released,watched:L.filter(l=>l.watched),backlog:released.filter(l=>!l.watched),upcoming:L.filter(l=>!(l.rel&&l.rel<=t))}; }
function judge(m){
  if(!m) return null;
  if(m.s) return m.s;
  const c=m.c||"";
  if(c.includes("x")) return "x";
  if(c.includes("t")) return "t";
  return "o";
}
const qn=p=>p.q1-p.q0+1;
const W=p=>({read:p.pg*p.rate, lec:18, prob:qn(p)*10});
function frac(p,round=1){
  const st=secState(p.id,round), w=W(p), tot=w.read+w.lec+w.prob;
  const done=Object.keys(st.marks).length;
  return ((st.read?w.read:0)+(st.lecture?w.lec:0)+Math.min(done,qn(p))/qn(p)*w.prob)/tot;
}
function status(p,round=1){
  const st=secState(p.id,round), done=Object.keys(st.marks).length;
  if(st.read && done>=qn(p)) return "done";
  if(st.read || done || st.lecture) return "part";
  return "none";
}
const lecLabel=l=>{const m=String(l.lec||l).match(/(\d{4})-(\d{2})(上旬|中旬|下旬)/);return m?(+m[2])+"月"+m[3]:String(l.lec||l);};
function lecDate(p){ const m=p.lec.match(/(\d{4})-(\d{2})(上旬|中旬|下旬)/); if(!m) return null; return m[1]+"-"+m[2]+"-"+({上旬:"01",中旬:"11",下旬:"21"}[m[3]]); }
function studyDaysBetween(a,b){ // a<b, 日曜を除く日数
  let n=0, d=parse(a); const e=parse(b); const sgn=d<=e?1:-1;
  if(sgn<0){ return -studyDaysBetween(b,a); }
  while(d<e){ d.setDate(d.getDate()+1); if(d.getDay()!==0) n++; } return n;
}
function plannedFrac(p,dateIso){
  if(dateIso<p.d0) return 0; if(dateIso>=p.d1) return 1;
  const all=studyDaysBetween(p.d0,p.d1)+1, el=studyDaysBetween(p.d0,dateIso)+1;
  return el/all;
}
function aheadDays(){
  const tw=p=>{const w=W(p);return w.read+w.lec+w.prob};
  const actual=PLAN.reduce((a,p)=>a+tw(p)*frac(p),0);
  const t=todayIso();
  const plannedAt=d=>PLAN.reduce((a,p)=>a+tw(p)*plannedFrac(p,d),0);
  // 実績に相当する計画日を探す
  let d=parse(PLAN[0].d0); d.setDate(d.getDate()-1);
  const end=parse(PLAN[PLAN.length-1].d1); let match=iso(d);
  while(d<=end){ const s=iso(d); if(plannedAt(s)<=actual+1e-6) match=s; else break; d.setDate(d.getDate()+1); }
  const total=PLAN.reduce((a,p)=>a+tw(p),0);
  const prev=parse(t); do{ prev.setDate(prev.getDate()-1); }while(prev.getDay()===0);
  return {days:studyDaysBetween(iso(prev),match), pct:actual/total, plannedPct:plannedAt(t)/total};
}

/* ===== 復習リスト =====
   ×か△を付けた問題を、翌日→（○なら）7日後→21日後に出す。3回続けて○なら卒業。途中で×か△なら翌日からやり直し。
   解き直すのは×と△の肢だけ。1日の上限は10問（超えた分は古い順に翌日以降へ）。
   記録画面での判定（同じ日に何度か直したら最後のもの）と、復習での判定（rev）を時系列で見る。 */

function reviewState(){
  const voided=new Set(EVENTS.filter(e=>e.t==="void").map(e=>e.target)), tl={};
  for(const e of EVENTS){ if(voided.has(e.id)) continue;
    if(e.t==="day") for(const it of e.items||[]) for(const [n,m] of Object.entries(it.probs||{})){ const k=it.sec+":"+n, a=tl[k]||(tl[k]=[]), r=judge(m);
      const last=a[a.length-1]; const x={date:e.date,r,src:"rec",m};
      if(last&&last.src==="rec"&&last.date===e.date) a[a.length-1]=x; else a.push(x); }
    if(e.t==="rev"){ const k=e.sec+":"+e.n; (tl[k]||(tl[k]=[])).push({date:e.date,r:e.r,src:"rev",id:e.id,lim:e.lim||null}); } }
  const out=[];
  for(const [k,a] of Object.entries(tl)){ let act=false, stage=0, due=null, bad=null, m=null, grad=null;
    for(const x of a){ if(x.m) m=x.m;
      if(x.r==="x"||x.r==="t"){ act=true; stage=0; due=addDays(x.date,REV_INT[0]); bad=x; grad=null; }
      else if(act){ stage++; if(stage>=REV_INT.length){ act=false; grad=x.date; } else due=addDays(x.date,REV_INT[stage]); } }
    if(!bad) continue; const [sec,n]=k.split(":").map(Number);
    out.push({k,sec,n,p:PLAN.find(q=>q.id===sec),act,stage,due,bad,m,grad,hist:a}); }
  return out.sort((x,y)=>(x.due||"").localeCompare(y.due||"")||x.sec-y.sec||x.n-y.n);
}

/* ===== 記録の自動保存 =====
   変更はまず「保存待ち（PEND）」にため、この端末にも即保存。操作が4秒止まったら・Sectionや日付を変えたら・画面を離れたら本番に保存する。
   保存できなかった分は、次に開いたときに自動で送る（同じIDは二重に保存しない）。 */
const PEND_KEY="sst_pend";
let PEND=null, PEND_T=null, PEND_BUSY=null, LAST_AUTO=null;
function pendLoad(){ try{ PEND=JSON.parse(ls.get(PEND_KEY)||"null"); }catch(e){ PEND=null; } }
function pendStore(){ if(PEND) ls.set(PEND_KEY,JSON.stringify(PEND)); else ls.del(PEND_KEY); }
function pendGet(){ const date=REC.form.date||todayIso();
  if(PEND && (PEND.date!==date || PEND.round!==REC.round || PEND.sec!==REC.draft.sec)) flushPend();
  if(!PEND) PEND={id:uid(),date,round:REC.round,sec:REC.draft.sec,probs:{},memo:""};
  return PEND; }
function pendChanged(){ pendStore(); clearTimeout(PEND_T); PEND_T=setTimeout(()=>flushPend(),4000); updAuto(); }
function pendProb(n){ const P=pendGet(); P.probs[n]={...REC.draft.marks[n]}; pendChanged(); }
function pendFlag(k,v){ const P=pendGet(); P[k]=v; pendChanged(); }
function pendEmpty(P){ return !P || (!Object.keys(P.probs).length && P.read===undefined && P.lecture===undefined && !P.memo); }
const Q_KEY="sst_queue";
function qGet(){ try{ return JSON.parse(ls.get(Q_KEY)||"[]"); }catch(e){ return []; } }
function qSet(q){ if(q.length) ls.set(Q_KEY,JSON.stringify(q)); else ls.del(Q_KEY); }
async function flushPend(){
  clearTimeout(PEND_T);
  const P=PEND; PEND=null; pendStore();
  if(!pendEmpty(P)){ const q=qGet(); q.push(P); qSet(q); }
  if(PEND_BUSY) await PEND_BUSY;
  PEND_BUSY=(async()=>{ let q=qGet(), ok=true, sent=0;
    while(q.length){ const X=q[0];
      if(!EVENTS.some(e=>e.id===X.id)){
        const it={sec:X.sec,round:X.round,probs:X.probs}; if(X.read!==undefined) it.read=X.read; if(X.lecture!==undefined) it.lecture=X.lecture;
        const ev={t:"day",id:X.id,ts:Date.now(),date:X.date,minutes:0,memo:X.memo||"",items:[it],auto:1};
        try{ await store.add(ev); EVENTS.push(ev); sent++; }catch(e){ console.error(e); ok=false; break; } }
      q.shift(); qSet(q); }
    if(sent){ derive(); LAST_AUTO=new Date(); writeFiles(false); }
    if(!ok){ PEND_T=setTimeout(()=>flushPend(),15000); toast("自動保存に失敗しました。あとで再送します"); }
    return {ok,sent}; })();
  const r=await PEND_BUSY; PEND_BUSY=null; updAuto();
  if(r.sent){ if(VIEW!=="rec") renderAll(); else refreshRecList(); }
  return r.ok;
}
function updAuto(){ const el=$("#dirty"); if(!el) return;
  el.textContent = (!pendEmpty(PEND)||qGet().length)? "保存待ち…（数秒で自動保存）" : (LAST_AUTO? "自動保存済み "+pad(LAST_AUTO.getHours())+":"+pad(LAST_AUTO.getMinutes()) : "変更は自動で保存されます"); }

  for(const s of SUBJ){
    const ps=PLAN.filter(p=>p.s===s); if(!ps.length) continue;
    const d0=ps[0].d0, d1=ps[ps.length-1].d1;
    let rd=0,rp=0,pg=0,lw=0,lr=0,qd=0,qa=0; const c={o:0,t:0,x:0};
    const rows=ps.map(p=>{ const {st,n,c:cc}=secCounts(p,round); pg+=p.pg; qa+=qn(p); qd+=n; c.o+=cc.o;c.t+=cc.t;c.x+=cc.x;
      if(st.read){rd++;rp+=p.pg;} if(st.lecture) lw++; const ld=lecDate(p); if(ld&&ld<=t) lr++;
      const stt=status(p,round), late=round===1&&p.d1<t&&stt!=="done", now=round===1&&p.d0<=t&&t<=p.d1;
      return `<div class="sj-sec ${now?"now":""}" data-go="${p.id}" title="押すと記録画面へ">
        <span class="k">Sec${p.k}</span><span class="tt">${esc(p.t)}${now?' <span class="chip ok">今日</span>':""}${late?' <span class="chip ng">遅れ</span>':""}<small>p.${p.p0}〜${p.p1}（${p.pg}p）・問${p.q0}〜${p.q1}・予定 ${md(p.d0)}${p.d1!==p.d0?"〜"+md(p.d1):""}</small></span>
        <span class="${st.read?"y":"n"}">教科書 ${st.read?"✓ "+md(st.read):"—"}</span>
        <span class="${st.lecture?"y":"n"}">講義 ${st.lecture?"✓ "+md(st.lecture):(ld&&ld<=t?"未視聴":esc(lecLabel(p)))}</span>
        <span class="${n>=qn(p)?"y":n?"m":"n"}">問題 ${n}/${qn(p)}</span>${n?ctx(cc):`<span></span>`}</div>`; }).join("");
    const allDone=ps.every(p=>status(p,round)==="done"), started=ps.some(p=>status(p,round)!=="none");
    const now=round===1&&d0<=t&&t<=d1, late=round===1&&d1<t&&!allDone;
    const chip=allDone?'<span class="chip ok">完了</span>':now?'<span class="chip mid">今の科目</span>':late?'<span class="chip ng">遅れ</span>':started?'<span class="chip">途中</span>':"";
    const rate=qd?Math.round(c.o/qd*100):null;
    h+=`<details class="sj ${now?"now":""}" ${now?"open":""}><summary data-sj="${s}">
      <span class="nm">${s} ${chip}</span><span class="muted">${md(d0)}〜${md(d1)}</span>
      <span><b>${rd}</b>/${ps.length}Sec<small>${rp}/${pg}p</small></span>
      <span><b>${lw}</b>/${ps.length}本<small>配信 ${lr}本</small></span>
      <span><b>${qd}</b>/${qa}問<small>${rate===null?"":"○率 "+rate+"%"}</small></span>
      ${qd?ctx(c):"<span></span>"}</summary><div class="sj-body">${rows}</div></details>`;
  }
  return h+`<p class="muted">○△×は問題ごとの判定（肢に×が1つでもあれば×、△があれば△）。○率＝解いた問題のうち○の割合。</p></div>`;
}

/* ===== 全体（長期ロードマップ） ===== */
/* 月ごとの流れ：1周目の科目・講義・節目は計画データから自動、それ以外は ROADMAP.months */
function monthFlowCard(t){
  const R=ROADMAP, md=d=>{const x=parse(d);return (x.getMonth()+1)+"/"+x.getDate();};
  const curYm=t.slice(0,7), L=lectureList();
  const rows=(R.months||[]).map(M=>{
    const ym=M.m, mEnd=ym+"-31", mNum=+ym.slice(5);
    const st=ym<curYm?"past":(ym===curYm?"now":"");
    // 科目（1周目の予定から）
    const subj=[];
    for(const sj of SUBJ){ const ps=PLAN.filter(p=>p.s===sj); if(!ps.length) continue;
      const a=ps.reduce((m,p)=>p.d0<m?p.d0:m,ps[0].d0), b=ps.reduce((m,p)=>p.d1>m?p.d1:m,ps[0].d1);
      if(a<=mEnd && b>=ym+"-01"){ const cur=a<=t&&t<=b; subj.push(`<span class="sj ${cur?"cur":""}">${sj} ${md(a)}〜${md(b)}${cur?"（今）":""}</span>`); } }
    const subjHtml = subj.length? "1周目："+subj.join("") : esc(M.subj||"");
    // 講義（配信目安の月で集計）
    const lg={}; for(const l of L){ const d=lecDate(l); if(!d||d.slice(0,7)!==ym) continue;
      const g=l.sec?PLAN.find(p=>p.id===l.sec).s:l.name; (lg[g]=lg[g]||{n:0,w:0,j:[]}); const jj=(l.lec.match(/(上旬|中旬|下旬)/)||[""])[0]; if(!lg[g].j.includes(jj)) lg[g].j.push(jj); lg[g].n++; if(S.lecW[l.key]) lg[g].w++; }
    const lecHtml=Object.entries(lg).map(([g,v])=>`<span class="sj">${esc(g)}${v.n>1?" "+v.n+"本":""}（${v.j.join("・")}）${v.w?(v.w>=v.n?" ✓":" "+v.w+"本視聴"):""}</span>`).join("");
    const ev=R.ms.filter(m=>m.d.slice(0,7)===ym).map(m=>`${esc(m.approx?m.approx.replace(/^\d+月/,"").replace(/^末$/,"月末"):md(m.d))} ${esc(m.t)}`).join("／");
    return `<div class="mon ${st}"><div class="ml">${mNum}月<small>${ym.slice(0,4)}</small></div><div style="flex:1">
      <div class="ln"><span class="lab">科目</span><div>${subjHtml}</div></div>
      ${M.work&&M.work.length?`<div class="ln"><span class="lab">やること</span><div>${M.work.map(esc).join("／")}</div></div>`:""}
      <div class="ln"><span class="lab">教材</span><div>${M.mat.map(esc).join("・")}</div></div>
      ${lecHtml?`<div class="ln"><span class="lab">講義</span><div>${lecHtml}</div></div>`:""}
      ${ev?`<div class="ln"><span class="lab">節目</span><div>${ev}</div></div>`:""}
    </div></div>`; });
  return `<div class="card"><h2>月ごとの流れ</h2>${rows.join("")}
    <p class="muted">1周目の科目・期間、講義の配信月、節目は計画データから自動表示。講義の時期は配信の目安です。2月以降の科目の割り振りは仮で、1月末に1周目の実績で組み直します。</p></div>`;
}

  h+=`<div class="now-line" style="left:${pos(t)}%"></div></div><div class="now-tag" style="left:${Math.max(3,Math.min(97,pos(t)))}%">今ここ</div><div style="height:22px"></div></div>
    <p class="muted">帯＝フェーズ（濃い色が今）、黄色の点＝節目、赤い線＝今日</p></div>`;
  h+=monthFlowCard(t);
  if(cur){
    h+=`<div class="card"><h2>今のフェーズでやること <span class="chip ok">${esc(cur.name)}${cur.round?"・"+esc(cur.round):""}</span></h2><ul class="todo">${cur.todo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${cur.mat.length?`<div style="margin-top:8px">${cur.mat.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}`;
    if(cur.round==="1周目") h+=`<div class="row" style="margin-top:12px"><div class="stat"><div class="lbl">1周目の進捗</div><div class="val">${Math.round(a.pct*100)}%</div><div class="muted">今日時点の予定 ${Math.round(a.plannedPct*100)}%</div></div><div class="stat"><div class="lbl">予定との差</div><div class="val" style="color:${a.days<0?"var(--ng)":"var(--ok)"}">${a.days>0?"+":""}${a.days}日</div></div></div>`;

  const up=R.ms.filter(m=>m.d>=t).slice(0,6);
  h+=`<div class="card"><h2>次の節目</h2>${up.length?up.map(m=>{const n=Math.round((parse(m.d)-parse(t))/864e5);return `<div class="ms-row"><span class="left">${n===0?"今日":"あと"+n+"日"}</span><span style="flex:1">${esc(m.t)}</span><span class="muted">${esc(m.approx||md(m.d))}</span></div>`}).join(""):`<p class="muted">予定された節目はありません。</p>`}</div>`;
  h+=`<div class="card"><h2>全フェーズ</h2>${R.phases.map(p=>{const st=p.d1<t?'<span class="chip ok">済</span>':(p.d0<=t&&t<=p.d1?'<span class="chip mid">進行中</span>':'<span class="chip">これから</span>');
    return `<div class="phase-row"><span class="when">${md(p.d0)}〜${md(p.d1)}</span><div style="flex:1"><b>${esc(p.name)}</b>${p.round?"（"+esc(p.round)+"）":""} ${st}<div class="muted">${p.todo.map(esc).join("／")}</div></div></div>`}).join("")}
    <p class="muted">2周目以降の期間と量は仮。1月末に1周目の実績で組み直します。</p></div>`;
  $("#v-all").innerHTML=h;
}

const sym=v=>({o:"○",x:"×",t:"△"}[v]||v);
function probRows(){

  const ks=Object.keys(S.sec).sort((a,b)=>{const [ra,ia]=a.split(":").map(Number),[rb,ib]=b.split(":").map(Number);return ra-rb||ia-ib;});
  for(const k of ks){ const st=S.sec[k]; const [round,id]=k.split(":"); const p=PLAN.find(x=>x.id==id);

function timeRows(){

/* ===== dataフォルダへの自動保存（File System Access API） ===== */
const FS_OK=("showDirectoryPicker" in window);
let DIR=null, FS_STATE="none", LAST_SAVED=null;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("sst",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
function updFs(){
  const el=$("#fsBar"); if(!el) return;
  if(!FS_OK){ el.innerHTML=""; $("#fsCard")&&( $("#fsDirName").textContent="このブラウザは自動保存に対応していません（PCのChrome／Edgeで使えます）。" ); return; }
  $("#fsDirName").textContent="保存先："+(DIR?DIR.name:"未設定");
  if(!DIR) el.innerHTML='｜<a href="#" id="fsSetLink">data保存：未設定</a>';
  else if(FS_STATE!=="granted") el.innerHTML='｜<button class="btn small" id="fsAllow">保存を許可</button>';
  else el.innerHTML="｜data保存："+(LAST_SAVED?"済（"+pad(LAST_SAVED.getHours())+":"+pad(LAST_SAVED.getMinutes())+"）":"待機中");
}
async function fsPerm(ask){ if(!DIR) return "none"; let p=await DIR.queryPermission({mode:"readwrite"}); if(p!=="granted"&&ask) p=await DIR.requestPermission({mode:"readwrite"}); return p; }
let FS_BUSY=null;
async function writeFiles(ask){
  if(!FS_OK||!DIR||!S) return false;
  if(FS_BUSY) await FS_BUSY;
  FS_BUSY=(async()=>{ try{
    FS_STATE=await fsPerm(ask);
    if(FS_STATE!=="granted"){ updFs(); return false; }
    for(const [name,rows] of [["演習記録.csv",probRows()],["学習時間.csv",timeRows()],["講義視聴.csv",lecRows()],["復習リスト.csv",revRows()]]){
      const fh=await DIR.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(csvText(rows)); await w.close(); }
    LAST_SAVED=new Date(); updFs(); return true;
  }catch(e){ console.error(e); toast("dataフォルダへの保存に失敗しました"); updFs(); return false; } })();
  const r=await FS_BUSY; FS_BUSY=null; return r;
}
async function pickDir(){
  try{ DIR=await window.showDirectoryPicker({id:"sst-data",mode:"readwrite"}); await kvSet("dir",DIR); if(!/data/i.test(DIR.name)) toast("フォルダ名が data ではありません。確認してください"); if(await writeFiles(true)) toast("dataフォルダに保存しました"); }
  catch(e){ if(e&&e.name!=="AbortError"){ console.error(e); toast("フォルダを選べませんでした"); } }
  updFs();
}
async function initFs(){ if(!FS_OK){ updFs(); return; } DIR=await kvGet("dir"); updFs(); if(DIR) await writeFiles(false); }

/* ===== タイマー（この端末のブラウザに状態を保存。記録は終了時に学習時間として保存） ===== */
const TM_KEY="sst_timer", TM_GAP=150000, TM_AWAY_MIN=60000;
let TM=null, TM_END=null, WAKE=null;
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());};
function tmLoad(){ try{ TM=JSON.parse(ls.get(TM_KEY)||"null"); }catch(e){ TM=null; } if(!TM) TM={state:null,lec:true,pending:0}; }
function tmSave(){ ls.set(TM_KEY,JSON.stringify(TM)); }
function tmElapsed(now=Date.now()){ if(!TM.state) return 0; return TM.acc+(TM.state==="run"? Math.max(0,now-TM.seg):0); }
const hms=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/3600)+":"+pad(Math.floor(s/60)%60)+":"+pad(s%60); };
function tmAway(ms){ if(ms>=TM_AWAY_MIN) TM.pending=(TM.pending||0)+ms; }
function tmStart(){ const now=Date.now(); TM={state:"run",lec:TM.lec!==false,pending:0,start:now,date:todayIso(),acc:0,seg:now,last:now,auto:false}; TM_END=null; tmSave(); wakeOn(); tmRender(); }
function tmPause(auto){ if(TM.state!=="run") return; const now=Date.now(); TM.acc+=Math.max(0,now-TM.seg); TM.state="pause"; TM.auto=!!auto; TM.awayFrom=now; tmSave(); if(!auto) wakeOff(); tmRender(); }
function tmResume(){ if(TM.state!=="pause") return; const now=Date.now(); if(TM.auto) tmAway(now-TM.awayFrom); TM.state="run"; TM.auto=false; TM.seg=now; TM.last=now; tmSave(); wakeOn(); tmRender(); }
function tmFinish(){ if(!TM.state) return; if(TM.state==="run") tmPause(false); TM_END={min:Math.round(tmElapsed()/60000),date:TM.date,from:hm(TM.start),to:hm(Date.now())}; wakeOff(); tmRender(); }
function tmReset(){ TM={state:null,lec:TM.lec!==false,pending:0}; TM_END=null; tmSave(); wakeOff(); tmRender(); }
async function tmSaveEnd(){
  const el=$("#tmMin"), minutes=Math.max(0,parseInt((el&&el.value)||"0",10)||0), date=($("#tmDate")&&$("#tmDate").value)||TM_END.date;
  if(!minutes){ if(confirm("0分です。記録せずにタイマーを終わりますか？")) tmReset(); return; }
  const ev={t:"time",id:uid(),ts:Date.now(),date,minutes,memo:"タイマー",from:TM_END.from,to:TM_END.to};
  try{ await store.add(ev); EVENTS.push(ev); derive(); tmReset(); toast("学習時間を追加しました（"+fmtMin(minutes)+"）"); renderAll(); writeFiles(false); }catch(e){ toast("保存に失敗しました"); }
}
/* 15秒以上の途切れ＝スリープ・ブラウザ終了など。150秒を超えた分は「止まっていた時間」 */
function tmTick(){
  if(!TM) return; const now=Date.now();
  if(TM.state==="run"){
    if(now-TM.last>TM_GAP){ TM.acc+=Math.max(0,TM.last-TM.seg); tmAway(now-TM.last); TM.seg=now; tmSave(); tmRender(); }
    TM.last=now; if(now%5000<1100) tmSave();
  }
  const t=$("#tmTime"); if(t) t.textContent=hms(tmElapsed(now));
  const hc=$("#tmChip"); if(hc) hc.textContent=tmChipText();
}
function tmChipText(){ if(!TM||!TM.state) return ""; return (TM.state==="run"?"● 計測中 ":"一時停止 ")+hms(tmElapsed()).slice(0,-3)+(!TM.lec&&TM.state==="run"?"（離れたら止める）":""); }
document.addEventListener("visibilitychange",()=>{
  if(!TM) return;
  if(document.visibilityState==="hidden"){ if(TM.state==="run" && !TM.lec) tmPause(true); else { TM.last=Date.now(); tmSave(); } }
  else { if(TM.state==="pause" && TM.auto) tmResume(); else if(TM.state==="run"){ tmTick(); wakeOn(); } }
});
window.addEventListener("pagehide",()=>{ if(TM&&TM.state==="run"){ TM.last=Date.now(); tmSave(); } });
async function wakeOn(){ try{ if(!WAKE && "wakeLock" in navigator && document.visibilityState==="visible"){ WAKE=await navigator.wakeLock.request("screen"); WAKE.addEventListener("release",()=>{WAKE=null;}); } }catch(e){} }
function wakeOff(){ try{ if(WAKE) WAKE.release(); }catch(e){} WAKE=null; }
function tmInit(){
  tmLoad(); const now=Date.now();
  if(TM.state==="run"){ TM.acc+=Math.max(0,(TM.last||now)-TM.seg); const gap=now-(TM.last||now); if(gap>15000) tmAway(gap); TM.seg=now; TM.last=now; tmSave(); wakeOn(); }
  else if(TM.state==="pause" && TM.auto && document.visibilityState==="visible") tmResume();
  setInterval(tmTick,1000);
}
function timerHtml(){
  if(!TM) tmLoad();
  const st=TM.state, lecBtn=`<label class="check" title="オンにすると、別のタブ・最小化・画面ロック・スリープのときに自動で止まります（PCでネットを見るなど脱線を除きたいとき）"><input type="checkbox" id="tmLec" ${TM.lec?"":"checked"}> 離れたら自動で止める</label>`;
  let h=`<div class="card" id="tmCard"><h2>タイマー ${st==="run"?`<span class="chip ok">計測中</span>`:st==="pause"?`<span class="chip mid">${TM.auto?"離れたので一時停止":"一時停止中"}</span>`:""}</h2>`;
  if(TM_END){
    h+=`<div class="row"><span>計測：<b>${fmtMin(TM_END.min)}</b>（${TM_END.from}〜${TM_END.to}）</span>
      <input type="date" id="tmDate" value="${TM_END.date}" style="width:auto"><input type="number" id="tmMin" min="0" step="1" value="${TM_END.min}" style="width:90px"><span>分</span>
      <button class="btn small" id="tmSaveEnd">学習時間に保存</button><button class="btn ghost small" id="tmBack">計測に戻る</button><button class="btn ghost small" id="tmDiscard">保存しないで終わる</button></div>
      <p class="muted">分数は直せます。日付は開始した日です。</p>`;
  } else {
    h+=`<div class="row" style="align-items:center"><div class="tmtime" id="tmTime">${hms(tmElapsed())}</div>
      ${!st?`<button class="btn" id="tmStart">開始</button>`:st==="run"?`<button class="btn ghost" id="tmPause">一時停止</button><button class="btn" id="tmFinish">終了</button>`:`<button class="btn" id="tmResume">再開</button><button class="btn ghost" id="tmFinish">終了</button>`}
      ${lecBtn}</div>`;
    if(TM.pending>=TM_AWAY_MIN && st) h+=`<div class="tmaway">止まっていた時間 ${fmtMin(Math.round(TM.pending/60000))} <button class="btn small" id="tmAddAway">足す</button><button class="btn ghost small" id="tmDropAway">足さない</button><span class="muted">講義など勉強していたなら「足す」</span></div>`;
    h+=`<p class="muted">${TM.lec?"紙の教材で勉強している間も止まりません。終わったら「終了」を押してください（止め忘れても、保存前に分数を直せます）。":"別のタブ・最小化・画面ロック・スリープのときは自動で止まり、戻ると再開します。1分以上止まっていたときは「足す」で戻せます。"}計測中はPCの画面が消えないようにします。</p>`;
  }
  return h+`</div>`;
}
function tmRender(){ const c=$("#tmCard"); if(c) c.outerHTML=timerHtml(); const hc=$("#tmChip"); if(hc) hc.textContent=tmChipText(); }
document.addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="tmStart") tmStart(); else if(id==="tmPause") tmPause(false); else if(id==="tmResume") tmResume(); else if(id==="tmFinish") tmFinish();
  else if(id==="tmBack"){ TM_END=null; tmResume(); }
  else if(id==="tmDiscard"){ if(confirm("計測した時間を保存せずに終わりますか？")) tmReset(); }
  else if(id==="tmSaveEnd") tmSaveEnd();
  else if(id==="tmAddAway"){ TM.acc+=TM.pending; TM.pending=0; tmSave(); tmRender(); toast("足しました"); }
  else if(id==="tmDropAway"){ TM.pending=0; tmSave(); tmRender(); }
  else if(id==="tmChip"){ show("today"); }
});
document.addEventListener("change",e=>{ if(e.target.id==="tmLec"){ TM.lec=!e.target.checked; tmSave(); tmRender(); } });
tmInit();

/* ===== イベント ===== */
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){ REC.sec=+go.dataset.go; REC.draft=null; if(VIEW==="today"&&TODAY_VIEW&&TODAY_VIEW<todayIso()) REC.form.date=TODAY_VIEW; show("rec"); return; }
  const nb=e.target.closest("#nav button"); if(nb){ if(nb.dataset.v==="today") TODAY_VIEW=null; show(nb.dataset.v); return; }
  const lb=e.target.closest(".lb[data-i]"); if(lb){ setLim(+lb.dataset.n,+lb.dataset.i,lb.dataset.v); renderRec(); focusRow(lb.dataset.n); return; }
  const ao=e.target.closest("[data-allo]"); if(ao){ setAllO(+ao.dataset.allo); renderRec(); focusRow(ao.dataset.allo); return; }
  const si=e.target.closest("[data-simple]"); if(si){ cycleSimple(+si.dataset.simple); renderRec(); focusRow(si.dataset.simple); return; }
  const vd=e.target.closest("[data-void]"); if(vd){ voidEv(vd.dataset.void); return; }
  const at=e.target.closest("[data-addtime]"); if(at){ addTime(at.dataset.addtime,at.dataset.date); return; }
  const lw=e.target.closest("[data-lecwatch]"); if(lw){ lecWatch(lw.dataset.lecwatch); return; }
  if(e.target.closest("[data-golec]")){ show("prog"); setTimeout(()=>$("#lecCard")&&$("#lecCard").scrollIntoView({behavior:"smooth"}),50); return; }
  if(e.target.id==="fsAllow"){ writeFiles(true).then(ok=>ok&&toast("dataフォルダに保存しました")); return; }
  if(e.target.id==="fsSetLink"){ e.preventDefault(); $("#set").classList.remove("hidden"); return; }
  if(e.target.id==="allDone"){ const p=PLAN.find(x=>x.id==REC.sec); for(let n=p.q0;n<=p.q1;n++) markDone(n); renderRec(); return; }
  if(e.target.id==="save"){ save(); return; }
});
document.addEventListener("change",e=>{
  if(e.target.id==="rSec"){ saveMemo(); flushPend(); REC.sec=+e.target.value; REC.draft=null; renderRec(); }
  if(e.target.id==="rRound"){ saveMemo(); flushPend(); REC.round=+e.target.value; REC.draft=null; renderRec(); }
  if(e.target.id==="rSimple"){ REC.simple=e.target.checked; renderRec(); }
  if(e.target.id==="rRead"&&REC.draft){ REC.draft.read=e.target.checked; pendFlag("read",e.target.checked); }
  if(e.target.id==="rLec"&&REC.draft){ REC.draft.lecture=e.target.checked; pendFlag("lecture",e.target.checked); }
  if(e.target.id==="rDate"){ saveMemo(); flushPend(); REC.form.date=e.target.value; REC.draft=null; renderRec(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="rMemo") REC.form.memo=e.target.value;
});
function focusRow(n){ const r=document.querySelector(`.prow[data-n="${n}"]`); if(r) r.focus(); }
document.addEventListener("keydown",e=>{
  const row=e.target.closest&&e.target.closest(".prow"); if(!row||VIEW!=="rec") return;
  const n=+row.dataset.n;
  if(/^[1-5]$/.test(e.key)&&!REC.simple){ e.preventDefault(); cycleLim(n,+e.key-1); renderRec(); focusRow(n); }
  else if(e.key==="0"){ e.preventDefault(); markDone(n); renderRec(); focusRow(n); }
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); const sib=e.key==="ArrowDown"?row.nextElementSibling:row.previousElementSibling; if(sib&&sib.classList.contains("prow")) sib.focus(); }
});
window.addEventListener("beforeunload",()=>{ pendStore(); if(!pendEmpty(PEND)||qGet().length) flushPend(); });
$("#openSet").onclick=()=>{ $("#set").classList.remove("hidden"); };
$("#closeSet").onclick=()=>$("#set").classList.add("hidden");
$("#set").onclick=e=>{ if(e.target.id==="set") $("#set").classList.add("hidden"); };
$("#expProb").onclick=expProb; $("#expTime").onclick=expTime; $("#expLec").onclick=expLec;
$("#pickDir").onclick=pickDir; $("#saveNow").onclick=()=>{ if(!DIR){ pickDir(); return; } writeFiles(true).then(ok=>ok&&toast("dataフォルダに保存しました")); };
$("#reload").onclick=()=>{ $("#set").classList.add("hidden"); refresh(); };
$("#forget").onclick=()=>{ if(confirm("この端末に保存した合言葉を消します。記録は消えません。")){ ls.del("sst_pass"); location.reload(); } };

/* ===== 起動 ===== */
function showLock(msg){ $("#app").classList.add("hidden"); $("#lock").classList.remove("hidden"); $("#passMsg").textContent=msg||""; $("#passIn").focus(); }
async function unlock(pass){
  KEY=await deriveKey(pass); ls.set("sst_pass",pass);
  $("#lock").classList.add("hidden"); $("#app").classList.remove("hidden");
  await refresh();
}
$("#passOk").onclick=()=>{ const v=$("#passIn").value; if(v.length<6){ $("#passMsg").textContent="6文字以上にしてください。"; return;} unlock(v); };
$("#passIn").onkeydown=e=>{ if(e.key==="Enter") $("#passOk").click(); };
(async()=>{
  $("#modeNote").textContent=CONFIGURED?"保存先：Supabase（暗号化）":"保存先：この端末のみ（お試しモード。Supabase未設定）";
  if(!CONFIGURED){ $("#app").classList.remove("hidden"); await refresh(); return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const p=ls.get("sst_pass"); if(p) await unlock(p); else showLock();
})();
</script>
